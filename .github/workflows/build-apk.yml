name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inject Telegram token (from GitHub Secret)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ]; then
            sed -i "s|__TG_BOT_TOKEN__|${TG_BOT_TOKEN}|" app/src/main/assets/index.html
          else
            echo "TG_BOT_TOKEN secret not set - Telegram features will be disabled"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CppUz-Kamola-apk
          path: app/build/outputs/apk/debug/app-debug.apk
